[workspace]
members = ["reedi-gix-compat", "reediif"]

[workspace.package]
version = "0.0.8"
edition = "2024"
rust-version = "1.99"

[package]
name = "reedi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "GPL-3.0-or-later"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
gix = { version = "0.89.0", default-features = false, features = ["sha1"] }
icu_properties = "2.3.0"
icu_segmenter = "2.3.0"
include_dir = "0.7.4"
jiff = "0.2.38"
nix = { version = "0.31.3", features = ["signal"] }
ratatui = "0.30.2"
reedi-gix-compat = { path = "reedi-gix-compat" }
reediif = { path = "reediif" }
serde = { version = "1.0.229", features = ["derive"] }
terminal-colorsaurus = "1.0.3"
toml = { version = "1.1.8", features = ["preserve_order"] }
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"

[features]
# The items that only the tests use, so that the integration tests can use them too.
test-support = []

[dev-dependencies]
insta = "1.49.0"
# Enables `test-support` for the integration tests.
reedi = { path = ".", features = ["test-support"] }
# Enables `test-support` for the tests of `reedi`.
reediif = { path = "reediif", features = ["test-support"] }
tempfile = "3.27.0"
unicode-bidi = "0.3.18"
