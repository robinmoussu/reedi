[package]
name = "reedi"
version = "0.0.8"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
gix = { version = "0.89.0", default-features = false, features = ["blob-diff", "sha1"] }
icu_properties = "2.3.0"
icu_segmenter = "2.3.0"
include_dir = "0.7.4"
jiff = "0.2.38"
libc = "0.2.191"
nix = { version = "0.31.3", features = ["signal"] }
ratatui = "0.30.2"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27.0"
terminal-colorsaurus = "1.0.3"
toml = { version = "1.1.8", features = ["preserve_order"] }
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"

[dev-dependencies]
insta = "1.49.0"
