[package]
name = "reedi"
version = "0.0.4"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"

[dependencies]
gix = { version = "0.89.0", default-features = false, features = ["blob-diff", "sha1"] }
icu_properties = "2.3.0"
icu_segmenter = "2.3.0"
jiff = "0.2.38"
nix = { version = "0.31.3", features = ["signal"] }
ratatui = "0.30.2"
regex = "1.13.1"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"

[dev-dependencies]
insta = "1.49.0"
