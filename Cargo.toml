[workspace]
members = ["reedi-crossterm-compat", "reedi-gix-compat", "reediif"]
# A workspace of its own (see `etc/modalkit-compatibility.md`).
exclude = ["modalkit"]

[workspace.package]
version = "0.0.13"
edition = "2024"
rust-version = "1.100"

[package]
name = "reedi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "GPL-3.0-or-later"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
gix = { version = "0.89.0", default-features = false, features = ["blob-diff", "max-performance-safe", "sha1", "status"] }
icu_properties = "2.3.0"
icu_segmenter = "2.3.0"
include_dir = "0.7.4"
jiff = "0.2.38"
modalkit-key = { path = "modalkit/crates/modalkit-key" }
nix = { version = "0.31.3", features = ["signal"] }
nonmax = "0.5.5"
# Only for `test-support`.
rand = { version = "0.10.3", optional = true }
# Only for `test-support`.
rand_chacha = { version = "0.10.0", optional = true }
ratatui = "0.30.2"
reedi-crossterm-compat = { path = "reedi-crossterm-compat" }
reedi-gix-compat = { path = "reedi-gix-compat" }
reediif = { path = "reediif" }
serde = { version = "1.0.229", features = ["derive"] }
# Only for `test-support`.
tempfile = { version = "3.27.0", optional = true }
terminal-colorsaurus = "1.0.3"
toml = { version = "1.1.8", features = ["preserve_order"] }
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"

[features]
# The items that only the tests use, so that the integration tests can use them too.
test-support = ["dep:rand", "dep:rand_chacha", "dep:tempfile"]

[[example]]
name = "performance_repository"
required-features = ["test-support"]

[[bench]]
name = "performance"
harness = false

[dev-dependencies]
divan = "0.1.21"
insta = "1.49.0"
# Enables `test-support` for the integration tests.
reedi = { path = ".", features = ["test-support"] }
# Enables `test-support` for the tests of `reedi`.
reediif = { path = "reediif", features = ["test-support"] }
tempfile = "3.27.0"
unicode-bidi = "0.3.18"

# The dependencies (gix, icu, …) are too slow to be used unoptimized, even while developing.
[profile.dev.package."*"]
opt-level = 3

# Optimized, with the symbols the profilers need (see `.justfile`).
[profile.profiling]
inherits = "release"
debug = true
