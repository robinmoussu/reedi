# A commit whose file names are too long for a single row, to show how the name of a file is
# shortened at the top of the screen: renamed, added, removed and binary files, long folders, long
# file stems, long extensions, file names without extension or starting with a dot, and file names
# with wide characters, multi-character graphemes or spaces, a renamed binary file, a file whose
# content is not valid UTF-8, a short file name in long folders, a file with a single line, a file
# with several extensions, and folders and file names starting or ending with spaces (one of them
# being the old name of a renamed file).
